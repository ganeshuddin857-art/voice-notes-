<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Запис — голосові нотатки</title>
<meta name="description" content="Наговори думку — вона збережеться текстом. Голосові нотатки з розпізнаванням мовлення">
<meta name="theme-color" content="#171420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Запис">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-title">Запис</span>
    </div>
    <div class="topbar-actions">
      <button id="searchToggle" class="icon-btn" aria-label="Пошук">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
      <button id="backupToggle" class="icon-btn" aria-label="Резервна копія">
        <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
      </button>
      <button id="installBtn" class="install-btn" hidden>Встановити</button>
    </div>
  </header>

  <div id="searchBar" class="search-bar" hidden>
    <input type="text" id="searchInput" placeholder="Пошук нотаток...">
  </div>

  <div class="tag-filters" id="tagFilters"></div>

  <main id="view" class="view"></main>

  <button id="micBtn" class="mic-fab" aria-label="Наговорити нотатку">
    <svg viewBox="0 0 24 24" class="mic-icon"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
  </button>
  <button id="typeBtn" class="type-fab" aria-label="Написати нотатку">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>

</div>

<div id="listenOverlay" class="listen-overlay" hidden>
  <div class="listen-top">
    <span class="listen-status" id="listenStatus">Слухаю…</span>
  </div>
  <div class="waveform" id="waveform">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="listen-transcript" id="listenTranscript"></div>
  <div class="listen-actions">
    <button class="btn secondary" id="listenCancel">Скасувати</button>
    <button class="btn" id="listenStop">Готово</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
